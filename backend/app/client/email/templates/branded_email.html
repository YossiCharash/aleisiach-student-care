<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#EDF2E3;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EDF2E3;padding:28px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" dir="rtl"
             style="max-width:540px;background:#ffffff;border-radius:18px;overflow:hidden;
                    font-family:'Heebo',Arial,Helvetica,sans-serif;
                    box-shadow:0 18px 40px -24px rgba(38,52,20,.35);">
        <tr><td style="background:linear-gradient(135deg,#4B9426 0%,#3F8420 55%,#336B19 100%);
                       padding:26px 32px;text-align:center;">
          <span style="display:inline-block;background:#ffffff;border-radius:14px;padding:12px 20px;">
            <img src="$logo_url" alt="$app_name" width="150"
                 style="display:block;width:150px;max-width:150px;height:auto;">
          </span>
        </td></tr>
        <tr><td style="padding:34px 34px 8px;text-align:right;">
          <h1 style="margin:0;font-size:22px;font-weight:600;color:#2A2E26;">$heading</h1>
          <p style="margin:16px 0 0;font-size:15px;line-height:1.8;color:#5E655A;">$lead</p>
        </td></tr>
        <tr><td style="padding:24px 34px 8px;text-align:center;">
          <a href="$link" style="display:inline-block;background:#3F8420;color:#ffffff;
             text-decoration:none;font-size:16px;font-weight:600;padding:14px 40px;border-radius:12px;">
            $button_label
          </a>
        </td></tr>
        <tr><td style="padding:14px 34px 26px;text-align:right;">
          <p style="margin:0;font-size:12.5px;line-height:1.7;color:#858C7E;">
            אם הכפתור אינו פועל, העתיקו את הקישור לדפדפן:<br>
            <a href="$link" style="color:#336B19;word-break:break-all;">$link</a>
          </p>
        </td></tr>
        <tr><td style="background:#F6F9F0;border-top:1px solid #E4E9DA;padding:18px 34px;text-align:right;">
          <p style="margin:0;font-size:12px;line-height:1.7;color:#858C7E;">
            $no_reply<br>$ignore
          </p>
          <p style="margin:10px 0 0;font-size:12px;color:#5E655A;font-weight:500;">$app_name · ליווי וקידום אישי</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
