[project]
name = "aleisiach-backend"
version = "0.1.0"
description = "Cloud Student Care System (Aleisiach) — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["sqlalchemy.orm.declared_attr"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
plugins = ["pydantic.mypy"]
mypy_path = ".."
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
